<svg viewBox="0 0 1150 1300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">

  <!-- ============ DEFS ============ -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34495e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16c784"/>
    </marker>
  </defs>

  <!-- ============ BACKGROUND ============ -->
  <rect x="0" y="0" width="1150" height="1300" fill="#ffffff"/>

  <!-- ============ TITLE BLOCK ============ -->
  <text x="575" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">Subscription &amp; Rate Limiting — Two-Layer Enforcement</text>
  <text x="575" y="66" text-anchor="middle" font-size="14" fill="#5a6472">Edge to application, tier-aware quota management</text>
  <line x1="130" y1="82" x2="1020" y2="82" stroke="#d0d5dd" stroke-width="1"/>

  <!-- ============ A: START TERMINATOR ============ -->
  <rect x="390" y="105" width="320" height="60" rx="30" ry="30" fill="#1a1a2e" stroke="#e94560" stroke-width="2"/>
  <text x="550" y="140" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Incoming API Request</text>

  <!-- Arrow A -> B -->
  <line x1="550" y1="165" x2="550" y2="205" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ B: PROCESS (Cloudflare Edge) ============ -->
  <rect x="360" y="205" width="380" height="82" rx="6" ry="6" fill="#eef1f7" stroke="#34495e" stroke-width="2"/>
  <text x="550" y="235" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1a1a2e">Cloudflare Edge</text>
  <text x="550" y="256" text-anchor="middle" font-size="13" fill="#2c3644">Global Rate Limit</text>
  <text x="550" y="274" text-anchor="middle" font-size="13" fill="#2c3644">+ DDoS Filter</text>

  <!-- Arrow B -> C -->
  <line x1="550" y1="287" x2="550" y2="325" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ C: DECISION (Abusive traffic?) ============ -->
  <polygon points="550,325 675,405 550,485 425,405" fill="#1a1a2e" stroke="#ffd700" stroke-width="2.5"/>
  <text x="550" y="399" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Abusive</text>
  <text x="550" y="418" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">traffic?</text>

  <!-- Arrow C -> D (Yes, left) -->
  <line x1="425" y1="405" x2="270" y2="405" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="345" y="384" width="42" height="20" fill="#ffffff"/>
  <text x="366" y="399" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">Yes</text>

  <!-- ============ D: TERMINATOR (Blocked at edge) ============ -->
  <rect x="60" y="365" width="210" height="80" rx="40" ry="40" fill="#3d0000" stroke="#e94560" stroke-width="2"/>
  <text x="165" y="396" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">&#9940; Blocked at Edge</text>
  <text x="165" y="415" text-anchor="middle" font-size="11.5" fill="#f4c7c7">(never reaches server)</text>

  <!-- Arrow C -> E (No, down) -->
  <line x1="550" y1="485" x2="550" y2="525" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="560" y="493" width="36" height="20" fill="#ffffff"/>
  <text x="578" y="508" text-anchor="middle" font-size="13" font-weight="700" fill="#34495e">No</text>

  <!-- ============ E: PROCESS (FastAPI receives request) ============ -->
  <rect x="380" y="525" width="340" height="62" rx="6" ry="6" fill="#eef1f7" stroke="#34495e" stroke-width="2"/>
  <text x="550" y="562" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1a1a2e">FastAPI Receives Request</text>

  <!-- Arrow E -> F -->
  <line x1="550" y1="587" x2="550" y2="625" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ F: PROCESS (Auth lookup) ============ -->
  <rect x="360" y="625" width="380" height="82" rx="6" ry="6" fill="#eef1f7" stroke="#34495e" stroke-width="2"/>
  <text x="550" y="655" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1a1a2e">Auth &#8594; account_id</text>
  <text x="550" y="676" text-anchor="middle" font-size="13" fill="#2c3644">&#8594; User Tier Lookup</text>

  <!-- Arrow F -> G -->
  <line x1="550" y1="707" x2="550" y2="745" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ G: PROCESS (Redis counter check) ============ -->
  <rect x="360" y="745" width="380" height="82" rx="6" ry="6" fill="#eef1f7" stroke="#34495e" stroke-width="2"/>
  <text x="550" y="775" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1a1a2e">Redis Counter Check</text>
  <text x="550" y="796" text-anchor="middle" font-size="13" fill="#2c3644">(per-user, per-action)</text>

  <!-- Arrow G -> H -->
  <line x1="550" y1="827" x2="550" y2="865" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ H: DECISION (Within tier limits?) ============ -->
  <polygon points="550,865 690,955 550,1045 410,955" fill="#1a1a2e" stroke="#ffd700" stroke-width="2.5"/>
  <text x="550" y="949" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Within tier</text>
  <text x="550" y="968" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">limits?</text>

  <!-- Arrow H -> I (Yes, right) -->
  <line x1="690" y1="955" x2="905" y2="955" stroke="#16c784" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="775" y="934" width="42" height="20" fill="#ffffff"/>
  <text x="796" y="949" text-anchor="middle" font-size="13" font-weight="700" fill="#16c784">Yes</text>

  <!-- ============ I: TERMINATOR (Request processed) ============ -->
  <rect x="905" y="915" width="210" height="80" rx="40" ry="40" fill="#0a3d0a" stroke="#16c784" stroke-width="2"/>
  <text x="1010" y="962" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">&#9989; Request Processed</text>

  <!-- Arrow H -> J (No - Free, down-left) -->
  <line x1="470" y1="1020" x2="340" y2="1105" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="330" y="1035" width="110" height="20" fill="#ffffff"/>
  <text x="385" y="1050" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">No — Free tier</text>

  <!-- Arrow H -> K (No - Paid, down-right) -->
  <line x1="630" y1="1020" x2="770" y2="1105" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="670" y="1035" width="110" height="20" fill="#ffffff"/>
  <text x="725" y="1050" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">No — Paid tier</text>

  <!-- ============ J: PROCESS (429 + Upgrade prompt) ============ -->
  <rect x="150" y="1105" width="360" height="100" rx="6" ry="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="2"/>
  <text x="330" y="1135" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7a1010">429 + Upgrade Prompt</text>
  <text x="330" y="1157" text-anchor="middle" font-size="12.5" fill="#7a1010">"Upgrade to Pro for</text>
  <text x="330" y="1175" text-anchor="middle" font-size="12.5" fill="#7a1010">unlimited saves"</text>

  <!-- ============ K: PROCESS (429 + Soft throttle) ============ -->
  <rect x="610" y="1105" width="360" height="100" rx="6" ry="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="2"/>
  <text x="790" y="1135" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7a1010">429 + Soft Throttle</text>
  <text x="790" y="1157" text-anchor="middle" font-size="12.5" fill="#7a1010">"Rate limit exceeded,</text>
  <text x="790" y="1175" text-anchor="middle" font-size="12.5" fill="#7a1010">retry in X seconds"</text>

  <!-- ============ LEGEND ============ -->
  <g>
    <rect x="60" y="1235" width="1030" height="55" rx="6" ry="6" fill="#fafbfc" stroke="#d0d5dd" stroke-width="1"/>
    <text x="80" y="1252" font-size="11.5" font-weight="700" fill="#5a6472">LEGEND:</text>

    <rect x="150" y="1243" width="26" height="16" rx="8" ry="8" fill="#1a1a2e" stroke="#e94560" stroke-width="1.5"/>
    <text x="184" y="1256" font-size="11.5" fill="#2c3644">Start / End</text>

    <rect x="272" y="1243" width="26" height="16" rx="3" ry="3" fill="#eef1f7" stroke="#34495e" stroke-width="1.5"/>
    <text x="306" y="1256" font-size="11.5" fill="#2c3644">Process Step</text>

    <polygon points="415,1251 428,1243 441,1251 428,1259" fill="#1a1a2e" stroke="#ffd700" stroke-width="1.5"/>
    <text x="450" y="1256" font-size="11.5" fill="#2c3644">Decision Point</text>

    <rect x="558" y="1243" width="26" height="16" rx="3" ry="3" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/>
    <text x="592" y="1256" font-size="11.5" fill="#2c3644">Blocked / Rejected</text>

    <rect x="720" y="1243" width="26" height="16" rx="8" ry="8" fill="#0a3d0a" stroke="#16c784" stroke-width="1.5"/>
    <text x="754" y="1256" font-size="11.5" fill="#2c3644">Success</text>

    <line x1="830" y1="1251" x2="864" y2="1251" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="874" y="1256" font-size="11.5" fill="#2c3644">Flow direction</text>

    <text x="80" y="1275" font-size="10.5" fill="#8a93a0">Layer 1: Cloudflare Edge (network-level) — Layer 2: FastAPI + Redis (application-level, tier-aware)</text>
  </g>

</svg>
